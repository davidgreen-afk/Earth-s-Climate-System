<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate I: Earth’s Climate System</title>
<style>
:root{--navy:#0D2137;--teal:#0B7A75;--teal2:#14A5A0;--gold:#F4A825;--slate:#334155;--paper:#F3F6F8;--card:#fff;--line:#D5DEE5;
  --ok:#0B7A75;--okbg:#E3F4F2;--bad:#A33A2B;--badbg:#FBE9E6;--warn:#7A4E00;--warnbg:#FFF4DB;
  --serif:Georgia,'Times New Roman',serif;--sans:Calibri,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.6;color:var(--slate);background:var(--paper)}
header.top{background:var(--navy);color:#fff;padding:12px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header.top h1{font-family:var(--serif);font-weight:normal;font-size:21px;margin:0;flex:1 1 260px}
header.top h1 small{display:block;font-family:var(--sans);font-size:14px;opacity:.8}
#wig{flex:0 0 260px;max-width:100%}#wig svg{display:block;width:100%;height:40px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto}
nav#rail{padding:18px 14px 40px 18px;border-right:1px solid var(--line);font-size:15px}
nav#rail button{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 8px;border-radius:7px;font:inherit;color:var(--slate);cursor:pointer;margin-bottom:2px}
nav#rail button.cur{background:#E2ECF2;color:var(--navy);font-weight:bold}
nav#rail .pip{flex:0 0 14px;height:14px;margin-top:5px;border-radius:50%;border:2px solid #9AA8B5}
nav#rail .done .pip{background:var(--teal);border-color:var(--teal)}
nav#rail small{display:block;font-weight:normal;color:#5b6b7a}
main{padding:22px 26px 80px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 28px;margin-bottom:18px}
.card h2{font-family:var(--serif);color:var(--navy);font-size:27px;margin:0 0 2px;font-weight:normal}
.card h3{font-family:var(--serif);color:var(--navy);font-size:20px;font-weight:normal;margin:26px 0 4px}
.sec{color:var(--teal);font-size:15px;margin:0 0 14px}
.card p,.card ul,.card ol{max-width:68ch}
figure{margin:16px 0;max-width:720px}figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
figure.narrow{max-width:400px}figure.mid{max-width:560px}figcaption{font-size:14.5px;color:#4a5b6b;margin-top:6px;max-width:68ch}
.pair{display:flex;gap:18px;flex-wrap:wrap}.pair figure{flex:1 1 260px;margin:10px 0}
.callout{margin:18px 0;padding:14px 18px;border-left:5px solid var(--gold);background:var(--warnbg);border-radius:6px;max-width:70ch;color:#4a3200}
.callout.key{border-left-color:var(--teal);background:var(--okbg);color:#06403D}
details{margin:14px 0;max-width:70ch}details summary{cursor:pointer;color:var(--teal);font-weight:bold}
.eq{font-family:var(--serif);font-size:19px;margin:12px 0;padding:8px 14px;background:#F6F9FB;border-left:4px solid var(--teal2);max-width:68ch;overflow-x:auto}
.act{margin:22px 0;padding:18px 20px;border:1px solid var(--line);border-left:5px solid var(--teal2);border-radius:8px;background:#FBFDFE}
.act.resolved{border-left-color:var(--teal);background:#F4FAF9}
.act .atag{font-size:14px;color:var(--teal);margin-bottom:2px}
.act .aq{font-weight:bold;color:var(--navy);margin:2px 0 10px;max-width:68ch}
.choices label{display:flex;gap:9px;align-items:flex-start;margin:6px 0;cursor:pointer;max-width:68ch}
.choices label input{margin-top:6px}
.choices label.right span{color:var(--ok);font-weight:bold}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button.b{font:inherit;font-weight:bold;border-radius:8px;padding:8px 18px;border:2px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.b.alt{background:#fff;color:var(--teal)}button.b.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
button.b.ghost{background:none;border-color:var(--line);color:var(--slate);font-weight:normal}
button.b:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9fd7d3}
input[type=text],textarea,select{font:inherit;color:var(--navy);padding:7px 10px;border:2px solid var(--line);border-radius:7px;background:#fff;max-width:100%}
input[type=text]{width:150px}textarea{width:100%;max-width:68ch;min-height:100px;resize:vertical}
.fb{margin-top:10px;max-width:70ch;padding:0}.fb.ok,.fb.no,.fb.hint{padding:10px 14px;border-radius:8px}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok);color:#06403D}
.fb.no{background:var(--badbg);border-left:5px solid var(--bad);color:#6B2418}
.fb.hint{background:var(--warnbg);border-left:5px solid var(--gold);color:#4a3200}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #E6ECF0;max-width:760px}
.crow .ct{flex:1 1 280px}.crow.ok select{border-color:var(--ok);background:var(--okbg)}.crow.no select{border-color:var(--bad)}
.crow .cfb{flex:1 1 100%;font-size:15px}.crow.ok .cfb{color:var(--ok)}.crow.no .cfb{color:var(--bad)}
.orow{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:720px}
.orow.ok{border-color:var(--ok);background:var(--okbg)}.orow .otxt{flex:1}
.orow button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;width:34px;height:34px;cursor:pointer}
.field{margin:12px 0}.field label{display:block;font-weight:bold;color:var(--navy);margin-bottom:4px}
.field .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field.ok input{border-color:var(--ok);background:var(--okbg)}.field.no input{border-color:var(--bad)}
.field .ffb{font-size:15px;margin-top:4px;max-width:68ch}.field.ok .ffb{color:var(--ok)}.field.no .ffb{color:var(--bad)}
.sph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.sph button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--navy)}
.sph button.seen{border-color:var(--teal);background:var(--okbg)}.sph button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{min-height:70px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:8px;max-width:68ch}
svg.w{width:100%;max-width:640px;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
svg.w text{font-family:var(--sans);font-size:13px;fill:var(--slate)}
input[type=range]{width:min(420px,100%);accent-color:var(--teal)}
.read{font-family:var(--serif);color:var(--navy);margin:6px 0}.read b{color:var(--teal)}
.nav2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px;align-items:center}
.prog{font-size:15px;color:#4a5b6b}
table.t{border-collapse:collapse;margin:10px 0}table.t td,table.t th{border:1px solid var(--line);padding:6px 12px;text-align:left}table.t th{background:#EAF1F5;color:var(--navy)}
.final .score{font-family:var(--serif);font-size:42px;color:var(--navy)}
#railbtn{display:none;margin:10px 12px 0}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav#rail{border-right:0;border-bottom:1px solid var(--line);max-height:0;overflow:hidden;padding:0 14px}
  nav#rail.open{max-height:none;padding:14px}#railbtn{display:inline-block}main{padding:16px 12px 70px}.card{padding:16px}}
</style>
</head>
<body>
<header class="top">
  <h1>Climate I: Earth’s Climate System<small>Background for the Global Climate Summit</small></h1>
  <div id="wig" aria-label="Progress"></div>
</header>
<button class="b ghost" id="railbtn" type="button">Show / hide modules</button>
<div class="layout"><nav id="rail" aria-label="Modules"></nav><main id="main"></main></div>
<script>
/* ================= Climate I lesson: library ================= */
(function(){
'use strict';
var Q=new URLSearchParams(location.search);
var PREVIEW=Q.get('preview')==='1';
var CONFIG={BLOCK_PASTE:false,MASTERY:70};
var LMS=(function(){
  var api=null,ok=false,mode='local',NS=PREVIEW?'climate1_prev_':'climate1_v1_';
  function find(w){var n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<12){w=w.parent;n++;}return(w&&w.API)?w.API:null;}
  try{api=find(window);if(!api&&window.opener)api=find(window.opener);}catch(e){api=null;}
  if(api&&!PREVIEW){try{ok=String(api.LMSInitialize(''))==='true';}catch(e){ok=false;}}
  mode=ok?'lms':'local';
  function lg(k){try{return localStorage.getItem(NS+k)||'';}catch(e){return '';}}
  function ls(k,v){try{localStorage.setItem(NS+k,v);}catch(e){}}
  return{mode:mode,
    get:function(k){if(mode==='lms'){try{return String(api.LMSGetValue(k));}catch(e){return '';}}return lg(k);},
    set:function(k,v){if(mode==='lms'){try{api.LMSSetValue(k,String(v));}catch(e){}}else ls(k,v);},
    commit:function(){if(mode==='lms'){try{api.LMSCommit('');}catch(e){}}},
    finish:function(){if(mode==='lms'){try{api.LMSCommit('');api.LMSFinish('');}catch(e){}mode='done';}}};
})();
function xmur(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return(h^=h>>>16)>>>0;};}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,key){var a=arr.slice(),r=mulberry(xmur(key)());for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function close(a,b,rel){rel=rel===undefined?0.02:rel;return Math.abs(a-b)<=Math.max(rel*Math.abs(b),1e-9);}
function fm(x,d){if(d===undefined)d=1;return Number(x.toFixed(d)).toLocaleString('en-US',{maximumFractionDigits:d});}

/* numbers and simple expressions: + - * / ^ ( ), e, ln(), exp(), sqrt(); no variables */
function evalNum(src){
  var s=String(src).toLowerCase().replace(/[\u2212\u2013]/g,'-').replace(/[\u00d7\u00b7]/g,'*').replace(/\u00f7/g,'/').replace(/[{\[]/g,'(').replace(/[}\]]/g,')').replace(/\s+/g,'');
  if(s.indexOf('=')>-1)s=s.slice(s.lastIndexOf('=')+1);
  s=s.replace(/(\d),(?=\d{3}(\D|$))/g,'$1').replace(/(\d(?:\.\d+)?)e([+-]?\d+)/g,'($1*10^($2))');
  if(!s)throw new Error('empty');
  var re=/(\d+\.?\d*|\.\d+)|([a-z]+)|([()+\-*\/^])/g,toks=[],m,last=0;
  while((m=re.exec(s))){
    if(m.index!==last)throw new Error('bad');last=re.lastIndex;
    if(m[1]!==undefined)toks.push({t:'n',v:parseFloat(m[1])});
    else if(m[2]){var w=m[2];
      if(w==='ln'||w==='exp'||w==='sqrt')toks.push({t:'f',v:w});
      else if(w==='e')toks.push({t:'e'});else throw new Error('sym');}
    else toks.push({t:'o',v:m[3]});
  }
  if(last!==s.length)throw new Error('bad');
  var pos=0;
  function pk(){return toks[pos];}
  function isOp(t,v){return t&&t.t==='o'&&t.v===v;}
  function atomStart(t){return t&&(t.t==='n'||t.t==='e'||t.t==='f'||isOp(t,'('));}
  function pExpr(){var a=pTerm();while(isOp(pk(),'+')||isOp(pk(),'-')){var op=toks[pos++].v,b=pTerm();a=op==='+'?a+b:a-b;}return a;}
  function pTerm(){var a=pUn();for(;;){var t=pk();
    if(isOp(t,'*')||isOp(t,'/')){pos++;var b=pUn();a=t.v==='*'?a*b:a/b;}
    else if(atomStart(t)){a=a*pUn();}else break;}return a;}
  function pUn(){if(isOp(pk(),'-')){pos++;return -pUn();}if(isOp(pk(),'+')){pos++;return pUn();}return pPow();}
  function pPow(){var b=pAtom();if(isOp(pk(),'^')){pos++;var neg=false;if(isOp(pk(),'-')){pos++;neg=true;}
    var x=pAtom();while(pk()&&(pk().t==='n'||pk().t==='e')){x=x*pAtom();}if(neg)x=-x;return Math.pow(b,x);}return b;}
  function pAtom(){var t=toks[pos++];if(!t)throw new Error('end');
    if(t.t==='n')return t.v;if(t.t==='e')return Math.E;
    if(t.t==='f'){var a=pAtom();return t.v==='ln'?Math.log(a):t.v==='exp'?Math.exp(a):Math.sqrt(a);}
    if(isOp(t,'(')){var v=pExpr();if(!isOp(pk(),')'))throw new Error('paren');pos++;return v;}
    throw new Error('tok');}
  var v=pExpr();if(pos!==toks.length||!isFinite(v))throw new Error('bad');return v;
}

/* ================= content: helpers and widgets ================= */
var ORDER=[],ACTS={},MODS=[];
function A(id,d){d.id=id;ACTS[id]=d;ORDER.push(id);return '<div data-act="'+id+'"></div>';}
function fig(src,alt,cap,cls){return '<figure'+(cls?' class="'+cls+'"':'')+'><img src="img/'+src+'.jpg" alt="'+alt+'"><figcaption>'+cap+'</figcaption></figure>';}
function mod(short,title,time,body){var ids=[],re=/data-act="([^"]+)"/g,m;while((m=re.exec(body)))ids.push(m[1]);MODS.push({short:short,title:title,time:time,body:body,acts:ids});}
function more(title,html){return '<details><summary>'+title+'</summary>'+html+'</details>';}
function svgNS(h){return h;}

function mountSpheres(box,done){
  var D=[['Atmosphere','The envelope of gases around Earth. It moves heat and water vapor around the planet and exchanges gases such as carbon dioxide with every other sphere.'],
    ['Hydrosphere','All of Earth’s liquid water: oceans, lakes, rivers and groundwater. Water stores huge amounts of heat and carries it around the globe in currents.'],
    ['Cryosphere','Frozen water: ice sheets, glaciers, sea ice and snow. Bright ice reflects sunlight back to space, and melting ice adds water to the oceans.'],
    ['Lithosphere','Earth’s rocky outer shell, including soil. It supplies volcanic gases, and rocks such as limestone and coal hold carbon for very long times.'],
    ['Biosphere','All living things. Photosynthesis pulls carbon dioxide out of the air, and respiration and decay return it.'],
    ['Anthrosphere','People and what we build and do: cities, farms, industry and energy use. Burning coal and other fossil fuels moves carbon from rocks into the atmosphere.']];
  box.innerHTML='<div class="sph">'+D.map(function(s,i){return '<button type="button" data-k="'+i+'">'+s[0]+'</button>';}).join('')+'</div><div class="panel" aria-live="polite">Select each sphere to read how it fits into the climate system.</div>';
  var seen={},n=0,panel=box.querySelector('.panel');
  Array.prototype.forEach.call(box.querySelectorAll('button'),function(b){b.onclick=function(){
    Array.prototype.forEach.call(box.querySelectorAll('button'),function(x){x.classList.remove('on');});b.classList.add('on','seen');
    var k=+b.dataset.k;panel.innerHTML='<b>'+D[k][0]+'.</b> '+D[k][1];if(!seen[k]){seen[k]=1;n++;}if(n===6)done();};});
}
function mountProd(box,done){
  box.innerHTML='<div class="read" id="pr"></div><label for="ps"><b>Precipitation (mm per year)</b></label><br><input type="range" id="ps" min="0" max="4500" step="100" value="0"><div style="max-width:520px;background:#E6ECF0;border-radius:6px;margin-top:10px"><div id="pb" style="height:20px;background:#14A5A0;border-radius:6px;width:0"></div></div>'+
    '<p style="font-size:14.5px;margin:4px 0">Bar length shows productivity out of the 3,000 g/m\u00b2/yr ceiling in the equation.</p>';
  var seen={};function upd(){var x=+box.querySelector('#ps').value,y=3000*(1-Math.exp(-0.000664*x));
    box.querySelector('#pr').innerHTML='Precipitation <b>'+fm(x,0)+'</b> mm/yr \u2192 productivity \u2248 <b>'+fm(y,0)+'</b> g/m\u00b2/yr';
    box.querySelector('#pb').style.width=(y/3000*100).toFixed(1)+'%';seen[x]=1;if(Object.keys(seen).length>=5)done();}
  box.querySelector('#ps').addEventListener('input',upd);upd();
}
function mountSeasons(box,done){
  var P=[['June 21',50,115,'The Northern Hemisphere leans toward the Sun: summer in the north, winter in the south. The Sun’s most direct rays reach the Tropic of Cancer.'],
    ['Sept 22',220,172,'Neither hemisphere leans toward the Sun, so the change of seasons is under way: fall in the north, spring in the south.'],
    ['Dec 21',390,115,'The Northern Hemisphere leans away from the Sun: winter in the north, summer in the south. The most direct rays reach the Tropic of Capricorn.'],
    ['Mar 20',220,58,'Again neither hemisphere leans toward the Sun: spring in the north, fall in the south.']];
  box.innerHTML='<div class="sph" id="sb"></div><svg class="w" id="ssvg" viewBox="0 0 440 230" role="img" aria-label="Simplified view of Earth at four points in its orbit, with its tilted axis pointing the same way each time"></svg><div class="panel" id="sp" aria-live="polite">Pick a date to see where Earth is and which way it leans.</div><p style="font-size:14px">Simplified sketch, not to scale. Earth’s axis always points the same way in space.</p>';
  var seen={};
  function draw(k){var s='<ellipse cx="220" cy="115" rx="170" ry="57" fill="none" stroke="#C5D2DC" stroke-dasharray="5 5"/><circle cx="220" cy="115" r="26" fill="#F4A825" stroke="#E08A00" stroke-width="2"/><text x="220" y="119" text-anchor="middle" style="fill:#0D2137">Sun</text>';
    P.forEach(function(p,i){var on=i===k,x=p[1],y=p[2],a=23.5*Math.PI/180,L=34,dx=Math.sin(a)*L,dy=-Math.cos(a)*L;
      s+='<g opacity="'+(on?1:0.35)+'"><circle cx="'+x+'" cy="'+y+'" r="20" fill="#2E7DB5" stroke="#0D2137" stroke-width="'+(on?3:1)+'"/><line x1="'+(x-dx)+'" y1="'+(y-dy)+'" x2="'+(x+dx)+'" y2="'+(y+dy)+'" stroke="#0D2137" stroke-width="3"/><text x="'+(x+dx+4)+'" y="'+(y+dy-2)+'" style="font-weight:bold">N</text>'+(y<100?'<text x="'+(x-28)+'" y="'+(y+4)+'" text-anchor="end">'+p[0]+'</text>':'<text x="'+x+'" y="'+(y+40)+'" text-anchor="middle">'+p[0]+'</text>')+'</g>';});
    box.querySelector('#ssvg').innerHTML=s;}
  box.querySelector('#sb').innerHTML=P.map(function(p,i){return '<button type="button" data-k="'+i+'">'+p[0]+'</button>';}).join('');
  Array.prototype.forEach.call(box.querySelectorAll('#sb button'),function(b){b.onclick=function(){var k=+b.dataset.k;draw(k);box.querySelector('#sp').innerHTML='<b>'+P[k][0]+'.</b> '+P[k][3];
    Array.prototype.forEach.call(box.querySelectorAll('#sb button'),function(x){x.classList.remove('on');});b.classList.add('on','seen');seen[k]=1;if(Object.keys(seen).length===4)done();};});
  draw(-1);
}
function mountAngle(box,done){
  box.innerHTML='<label for="as"><b>Height of the Sun above the horizon</b></label><br><input type="range" id="as" min="15" max="90" step="1" value="90"><div class="read" id="ar"></div><svg class="w" id="asvg" viewBox="0 0 440 210" role="img" aria-label="A beam of sunlight hitting flat ground at an adjustable angle"></svg>';
  var lo=false,hi=false;
  function upd(){var th=+box.querySelector('#as').value,r=th*Math.PI/180,sn=Math.sin(r),cs=Math.cos(r),W=40,L=W/sn,x0=150,gy=180;
    function back(x){return [x-170*cs,gy-170*sn];}
    var a=back(x0),b=back(x0+L);
    box.querySelector('#asvg').innerHTML='<line x1="10" y1="'+gy+'" x2="430" y2="'+gy+'" stroke="#334155" stroke-width="3"/><polygon points="'+a[0]+','+a[1]+' '+b[0]+','+b[1]+' '+(x0+L)+','+gy+' '+x0+','+gy+'" fill="#F4A825" opacity=".55"/><line x1="'+x0+'" y1="'+gy+'" x2="'+(x0+L)+'" y2="'+gy+'" stroke="#0B7A75" stroke-width="7"/><text x="'+(x0+L/2)+'" y="'+(gy+22)+'" text-anchor="middle">ground lit by the beam</text>';
    box.querySelector('#ar').innerHTML='Sun '+th+'\u00b0 above the horizon: the same beam covers <b>'+(1/sn).toFixed(2)+' times</b> as much ground, so each square meter receives about <b>'+Math.round(sn*100)+'%</b> as much energy as with the Sun overhead.';
    if(th<=35)lo=true;if(th>=85)hi=true;if(lo&&hi)done();}
  box.querySelector('#as').addEventListener('input',upd);upd();
}
function mountTilt(box,done){
  box.innerHTML='<label for="ts"><b>Tilt of Earth’s axis (degrees)</b></label><br><input type="range" id="ts" min="22.1" max="24.5" step="0.1" value="23.4"><div class="read" id="tr"></div><svg class="w" id="tsvg" viewBox="0 0 440 210" style="max-width:420px" role="img" aria-label="Earth with an axis tilted by the chosen angle"></svg>';
  var lo=false,hi=false;
  function upd(){var t=+box.querySelector('#ts').value,a=t*Math.PI/180,dx=Math.sin(a)*90,dy=Math.cos(a)*90;
    box.querySelector('#tsvg').innerHTML='<line x1="220" y1="10" x2="220" y2="200" stroke="#9AA8B5" stroke-dasharray="5 5"/><circle cx="220" cy="105" r="62" fill="#2E7DB5" stroke="#0D2137" stroke-width="2"/><line x1="'+(220-dx)+'" y1="'+(105+dy)+'" x2="'+(220+dx)+'" y2="'+(105-dy)+'" stroke="#F4A825" stroke-width="5"/><text x="'+(220+dx+8)+'" y="'+(105-dy+4)+'" style="font-weight:bold">North pole</text><text x="20" y="30">Today: 23.45\u00b0 (the range is 22.1\u00b0 to 24.5\u00b0)</text>';
    box.querySelector('#tr').innerHTML='Tilt <b>'+t.toFixed(1)+'\u00b0</b> \u2192 '+(t>23.8?'larger tilt: more severe seasons (warmer summers, colder winters)':t<23.0?'smaller tilt: milder seasons (cooler summers, milder winters)':'close to today’s tilt');
    if(t<=22.3)lo=true;if(t>=24.3)hi=true;if(lo&&hi)done();}
  box.querySelector('#ts').addEventListener('input',upd);upd();
}

`<p>This self-guided lesson turns the <i>Climate I</i> slides into steps you work through yourself. It is background for the Global Climate Summit: by the end you will be able to explain how Earth’s climate works, how scientists study it, and which kinds of claims about climate you can check against evidence. Every activity gives feedback, and you can retry as often as you like.</p>

<h3>Earth as a whole</h3>
<p>Climate is not a single thing. It is the result of <b>six interacting spheres</b>: the atmosphere, hydrosphere, cryosphere, lithosphere, biosphere and anthrosphere. Energy, water and chemicals move between them all the time.</p>

mod('Controls on climate','4. Controls on climate','About 15 minutes',
`<p>Why is it warm at the equator, cold at the poles, and rainy in some bands of latitude and dry in others? Three controls do most of the work: the way sunlight reaches Earth, the circulation of the atmosphere, and the circulation of the ocean.</p>
<h3>Seasons: it is the tilt</h3>
<p>The tilt of Earth’s axis relative to the plane of its orbit causes the seasons. The hemisphere pointing toward the Sun is in summer, and the opposite hemisphere is in winter.</p>
${fig('seasons','Diagram of Earth at four positions around the Sun, labeled spring equinox March 20, summer solstice June 21, fall equinox September 22 and winter solstice December 21, with the Tropic of Cancer, Equator and Tropic of Capricorn marked','Earth’s orbit with the equinoxes and solstices.')}
${A('seasonsExplore',{type:'explore',q:'Step through the year and watch which way Earth leans.',mount:mountSeasons,done:'The axis never changes direction. Earth’s position in its orbit changes which hemisphere leans toward the Sun.'})}
${A('seasonsMcq',{type:'mcq',q:'What causes the seasons?',opts:[{t:'The tilt of Earth’s axis relative to its orbit'},
  {t:'Earth is closer to the Sun in summer',fb:'It is a common idea, but not the cause. Earth is closest to the Sun in January, during Northern Hemisphere winter.'},
  {t:'The Sun gets brighter in summer and dimmer in winter',fb:'Changes in solar output do happen, but not on a yearly cycle that flips between hemispheres.'},
  {t:'Earth’s axis points toward a different star each season',fb:'The axis points the same way all year. Look at the explorer: it did not change direction.'}],ans:0,
  why:'Because the axis keeps pointing the same way, first one hemisphere and then the other leans toward the Sun as Earth travels around it. The two hemispheres have opposite seasons.'})}
<h3>The angle of sunlight</h3>
<p>Near the equator the Sun is high in the sky and its rays strike the ground nearly head-on. Farther from the equator the rays arrive at a slant, or obliquely.</p>
${fig('angle','Diagram of sunlight reaching Earth at the equator as a direct ray at 90 degrees and at higher latitudes as oblique rays at 55 and 37 degrees, with shaded patches showing that oblique rays cover a larger area','Direct and oblique rays cover different amounts of ground.')}
${A('angleExplore',{type:'explore',q:'Lower the Sun and see what happens to the lit patch of ground.',mount:mountAngle,done:'A low Sun spreads the same energy over more ground, so each square meter gets less.'})}
${A('angleMcq',{type:'mcq',q:'Why does sunlight warm high latitudes less than the equator?',opts:[{t:'Slanted rays spread the same energy over a larger area of ground'},
  {t:'The Sun is much farther from the poles than from the equator',fb:'The difference in distance is tiny compared with the distance to the Sun. The angle of the rays is what matters.'},
  {t:'No sunlight reaches high latitudes',fb:'Sunlight does reach them. Look at the explorer: the beam still arrives, but it is spread out.'},
  {t:'High latitudes are always at higher elevation',fb:'Elevation varies from place to place and is not the main control here.'}],ans:0,
  why:'The same beam covers more ground at a slant, so each square meter receives less energy.'})}
<h3>Atmospheric circulation</h3>
<p>Uneven heating drives the atmosphere. At the equator heated air rises. That rising air cools and drops its water as rain, which is why tropical forests grow there. The same air, now dry, travels poleward high up, sinks, and returns along the surface. This loop is a <b>Hadley cell</b>.</p>
<div class="pair">${fig('circ3d','Cutaway of Earth showing global wind belts such as the trade winds, horse latitudes, westerlies and polar easterlies, with Hadley cells at low latitudes','Global wind belts.')}${fig('hadley','Diagram of a Hadley cell: air heats and rises at the equator, rain falls as hot wet air cools, dry cold air moves poleward aloft, dry air descends near 20 to 30 degrees, and air gains moisture as it returns toward the equator','A Hadley cell.')}</div>
${A('hadley',{type:'order',q:'Put the steps of one Hadley cell in order, starting at the equator.',
 items:['Air heated at the equator rises.','The rising, hot, wet air cools and rain falls.','Dry, cold air moves toward higher latitudes high in the atmosphere.','The air sinks at about 20° to 30° latitude, warming and drying as it descends.','Air flows back toward the equator near the surface, gaining moisture on the way.'],
 nudge:'Follow one parcel of air around the loop: where does it start, where does it lose its water, and where does it come back down?',why:'Rising, wet air at the equator and sinking, dry air near 20° to 30° set up the wet and dry bands of latitude.'})}
${A('hadleyDesert',{type:'mcq',q:'Why are many deserts found near 20° to 30° latitude?',opts:[{t:'Air that has already lost its moisture sinks there, warming and drying as it descends'},
  {t:'Those latitudes are closest to the Sun',fb:'The Sun is most direct nearer the equator. Think about what the air is doing at 20° to 30°.'},
  {t:'Rain falls only over land at those latitudes',fb:'Rainfall depends on moisture and rising air, not on land versus ocean alone.'},
  {t:'The air rises there and carries moisture away',fb:'Look at your ordered steps: the air rises at the equator, but sinks near 20° to 30°.'}],ans:0,
  why:'Sinking air is dry and tends to suppress rain, so deserts often lie beneath the descending branch of the Hadley cell.'})}
<h3>Ocean circulation</h3>
<p>Atmospheric circulation drives surface ocean currents. Deep circulation is different: <b>thermohaline circulation</b> is driven by differences in seawater density, which come from differences in temperature (<i>thermo</i>) and salinity (<i>haline</i>).</p>
${fig('thermohaline','World map showing the global ocean conveyor belt: warm surface currents in one color, cold salty deep currents in another, with heat released to the atmosphere in the North Atlantic','Thermohaline circulation moves heat and water around the global ocean.')}
${A('thermo',{type:'mcq',q:'Which seawater is the most dense, and so most likely to sink?',opts:[{t:'Cold and salty'},{t:'Warm and salty',fb:'Salt adds density, but warmth reduces it. Which combination makes the water heaviest?'},
  {t:'Cold and fresh',fb:'Cold adds density, but fresh water is lighter than salty water.'},{t:'Warm and fresh',fb:'Both warmth and low salt make water lighter. This is the least dense of the four.'}],ans:0,
  why:'Colder and saltier water is denser, so it sinks and drives deep circulation.'})}
${A('thermoUncertain',{type:'mcq',q:'Some scientists have proposed that warming could change Atlantic circulation and cool western Europe. What is the most accurate statement of where the science stands?',opts:[{t:'Ocean circulation matters for regional climate, but global ocean data go back only to the early 1990s, so predictions of future ocean changes are uncertain'},
  {t:'Scientists have proven that warming will trigger a new ice age in Europe',fb:'Not so. A warming-induced ice age is not considered very likely by climate scientists.'},
  {t:'Ocean circulation has no effect on regional climate',fb:'It matters a great deal. It helps maintain regional climates.'},
  {t:'Ocean circulation is fully understood and can be predicted exactly',fb:'Global ocean data sets are short, so there is large uncertainty in future ocean changes.'}],ans:0,
  why:'The idea highlights how important ocean circulation is for regional climate, while the short data record leaves large uncertainty.'})}
${more('Go deeper: why it matters','<p>One popular hypothesis says that as Earth as a whole warms, Atlantic circulation could change and produce cooling in Western Europe. In its most extreme form, advancing European ice sheets would trigger a new ice age. Climate scientists do not consider a global-warming-induced ice age very likely, but the idea shows how much ocean circulation matters in maintaining regional climates.</p>')}`);

mod('Climate through time','5. Climate through time','About 15 minutes',

<p>The deck lists four things that influence these fluctuations. Sort them.</p>
${A('tempCauses',{type:'classify',q:'Which of these changes involve Earth’s orbit around the Sun (the basis of Milankovitch cycles)?',cats:['Change in Earth’s orbit, tilt or wobble','Another natural driver'],

<h3>Milankovitch cycles</h3>
<p>Earth’s climate changes on slow time scales in response to plate tectonics and to Earth’s orbit. Milutin Milanković hypothesized that climate variation over 100 to 300 thousand years is predicted by cyclic changes in orbital geometry. These cycles redistribute sunlight across Earth’s surface and seasons, and they set the timing and pacing of major climate shifts. (One thousand years is written “ka,” for kilo-annum.)</p>
${fig('milank','Illustration of the three Milankovitch cycles: eccentricity at 100,000 years, tilt at 41,000 years between 22.1 and 24.5 degrees, and wobble or precession at 23,000 years, with graphs of sunlight reaching 65 degrees north','The three Milankovitch cycles and the sunlight they redistribute at high northern latitudes.','narrow')}
<div class="pair">${fig('eccentric','Diagram of Earth’s elliptical orbit around the Sun with perihelion and aphelion labeled','Eccentricity: the shape of Earth’s orbit changes (about 100,000 years).')}${fig('obliq','Diagram of Earth’s axis at maximum tilt 24.5 degrees, present tilt 23.5 degrees and minimum tilt 22.1 degrees','Obliquity: the tilt changes (about 41,000 years).')}${fig('precess','Diagram of Earth’s axis wobbling so that it points to Polaris now and to Vega 11,000 years ago','Precession: the axis wobbles (about 23,000 years).')}</div>
<p>When cooling effects of the different cycles coincide, ice ages may result.</p>
${A('tiltExplore',{type:'explore',q:'Change Earth’s tilt across its natural range and watch the description change.',mount:mountTilt,done:'The tilt moves only between about 22.1° and 24.5°, yet that is enough to change the strength of seasons.'})}

${A('cycles',{type:'classify',q:'Match each description to the Milankovitch cycle it belongs to.',cats:['Eccentricity (orbit shape)','Obliquity (tilt)','Precession (wobble)'],
 items:[{t:'Repeats about every 100,000 years',c:0,hint:'This is the longest of the three.'},{t:'Repeats about every 41,000 years',c:1,hint:'This is the middle one.'},{t:'Repeats about every 23,000 years',c:2,hint:'This is the shortest of the three.'},

/* ---------- modules ---------- */
function renderMod(i){
  S.m=i;var m=MODS[i],main=$('main');
  main.innerHTML='<article class="card"><h2>'+m.title+'</h2><p class="sec">'+m.time+'</p>'+m.body+'</article>'+
    '<div class="nav2"><div><button type="button" class="b alt" id="bPrev"'+(i===0?' disabled':'')+'>Previous module</button></div><span class="prog" id="modprog"></span><div>'+
    (i<MODS.length-1?'<button type="button" class="b" id="bNext">Next module</button>':'<button type="button" class="b" id="bFin">Finish the lesson</button>')+'</div></div>';
  Array.prototype.forEach.call(main.querySelectorAll('[data-act]'),function(x){mountAct(x,x.dataset.act);});
  save();refresh();window.scrollTo(0,0);
}
function showFinal(){
  var sc=Math.round(score()),h='<div class="card final"><h2>Lesson complete</h2><p class="sec">Mastery score on the checks</p><div class="score">'+sc+'%</div>'+
   '<p>Full credit means you got an activity right with at most one miss. Showing an answer earns half credit. Use this to decide what to revisit before the Summit.</p><table class="t"><tr><th>Module</th><th>Credit</th></tr>';
  MODS.forEach(function(m){var ids=m.acts.filter(function(id){return ACTS[id].type!=='explore';}),t=0;ids.forEach(function(id){t+=CREDIT[S.a[id]]||0;});h+='<tr><td>'+m.short+'</td><td>'+Math.round(100*t/ids.length)+'%</td></tr>';});
  h+='</table><h3>Take these to the Summit</h3><ul>'+TAKEAWAYS.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul><div class="btns"><button type="button" class="b alt" id="bRev">Review a module</button></div></div>';
  $('main').innerHTML=h;window.scrollTo(0,0);$('bRev').onclick=function(){renderMod(0);};
  if(PREVIEW)return;
  function hms(t){function z(x){return(x<10?'0':'')+x;}return z(Math.floor(t/3600))+':'+z(Math.floor(t%3600/60))+':'+z(t%60);}
  var stat=sc>=CONFIG.MASTERY?'passed':'completed';
  LMS.set('cmi.core.score.min','0');LMS.set('cmi.core.score.max','100');LMS.set('cmi.core.score.raw',String(sc));
  LMS.set('cmi.core.lesson_status',stat);LMS.set('cmi.core.exit','');LMS.set('cmi.core.session_time',hms(Math.max(0,Math.round((Date.now()-S.t0)/1000))));
  save();LMS.set('cmi.core.lesson_status',stat);LMS.set('cmi.core.exit','');LMS.commit();
}
document.addEventListener('click',function(e){
  var t=e.target;while(t&&t!==document&&!t.id&&!(t.dataset&&t.dataset.m!==undefined))t=t.parentNode;if(!t||t===document)return;
  if(t.dataset&&t.dataset.m!==undefined&&t.closest&&t.closest('#rail')){renderMod(+t.dataset.m);$('rail').classList.remove('open');return;}
  if(t.id==='bNext')renderMod(S.m+1);else if(t.id==='bPrev')renderMod(S.m-1);else if(t.id==='bFin')showFinal();else if(t.id==='railbtn')$('rail').classList.toggle('open');
});
window.addEventListener('pagehide',function(){if(!PREVIEW&&LMS.mode==='lms'){save();LMS.finish();}});
if(CONFIG.BLOCK_PASTE){['copy','cut','paste','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},true);});}
load();drawWig();renderMod(S.m);
})();
</script></body></html>
